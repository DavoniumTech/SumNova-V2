<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <!-- Primary Meta Tags -->
    <title>SumNova | Learn Faster. Understand Better.</title>
    <meta name="description" content="SumNova is a premium AI-powered SaaS application that helps you summarize texts, documents, and web pages instantly. Learn faster and understand better with advanced AI.">
    <meta name="keywords" content="AI summary, text summarization, productivity SaaS, document analysis, Davonium Technologies, SumNova">
    <meta name="author" content="Davonium Technologies">
    <meta name="theme-color" content="#2563EB">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://sumnova.com/">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sumnova.com/">
    <meta property="og:title" content="SumNova | Learn Faster. Understand Better.">
    <meta property="og:description" content="Digest vast amounts of information in seconds. SumNova uses advanced AI to summarize documents, articles, and text into clear, concise insights.">
    <meta property="og:image" content="https://sumnova.com/assets/icons/icon-512.png">
    <meta property="og:site_name" content="SumNova">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://sumnova.com/">
    <meta name="twitter:title" content="SumNova | Learn Faster. Understand Better.">
    <meta name="twitter:description" content="Digest vast amounts of information in seconds. SumNova uses advanced AI to summarize documents, articles, and text into clear, concise insights.">
    <meta name="twitter:image" content="https://sumnova.com/assets/icons/icon-512.png">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "SumNova",
      "operatingSystem": "All",
      "applicationCategory": "ProductivityApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Davonium Technologies"
      }
    }
    </script>
    
    <!-- PWA & Assets -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="assets/icons/icon-512.png">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="app-body">

    <!-- Accessibility Skip Link -->
    <a href="#app-root" class="skip-link sr-only focusable">Skip to main content</a>

    <!-- Global Loading Screen -->
    <div id="loading-screen" class="loading-overlay" aria-live="assertive" role="alert">
        <div class="spinner" id="global-spinner"></div>
        <p id="loading-text">Loading SumNova...</p>
    </div>

    <div id="app-shell" class="app-container">
        
        <!-- Global Header Component Container -->
        <div id="shell-header-container">
            <!-- header.html will be injected here by router/ui logic if applicable -->
        </div>

        <!-- MAIN ROUTER VIEW CONTAINER -->
        <main id="app-root" role="main" aria-live="polite">
            <!-- Route views (landing, login, workspace, etc.) will be dynamically injected here -->
        </main>

        <!-- Global Footer Component Container -->
        <div id="shell-footer-container">
            <!-- footer.html will be injected here by router/ui logic if applicable -->
        </div>

    </div>

    <!-- Global UI Overlay Containers -->
    <div id="toast-container" class="toast-wrapper" aria-live="assertive" role="alert"></div>

    <div id="modal-container" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content" id="modal-content-box">
            <header class="modal-header">
                <h2 id="modal-title">Dialog Title</h2>
                <button id="btn-close-modal" class="btn-icon" aria-label="Close modal">X</button>
            </header>
            <div class="modal-body" id="modal-body-content">
                <!-- Modal content injected dynamically -->
            </div>
            <footer class="modal-footer" id="modal-footer-actions">
                <!-- Modal actions injected dynamically -->
            </footer>
        </div>
    </div>

    <!-- ES Module Architecture -->
    <!-- Core Configuration and Utilities -->
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/constants.js"></script>
    <script type="module" src="js/helpers.js"></script>
    <script type="module" src="js/storage.js"></script>
    
    <!-- UI & Presentation Layer -->
    <script type="module" src="js/theme.js"></script>
    <script type="module" src="js/loader.js"></script>
    <script type="module" src="js/toast.js"></script>
    <script type="module" src="js/modal.js"></script>
    <script type="module" src="js/navigation.js"></script>
    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/validator.js"></script>
    
    <!-- Business Logic & State -->
    <script type="module" src="js/settings.js"></script>
    <script type="module" src="js/firestore.js"></script>
    <script type="module" src="js/ai.js"></script>
    <script type="module" src="js/auth.js"></script>
    
    <!-- Routing & App Initialization -->
    <script type="module" src="js/router.js"></script>
    <script type="module" src="js/app.js"></script>
<noscript>

This application requires JavaScript.

</noscript>
  
  
</body>
</html>
